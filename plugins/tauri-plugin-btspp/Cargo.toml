[package]
name = "tauri-plugin-btspp"
version = "0.1.0"
edition = "2021"
description = "Bluetooth Classic SPP (RFCOMM) транспорт для ELM327 (Android)"
license = "MIT"
links = "tauri-plugin-btspp"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
default = []

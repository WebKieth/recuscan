[package]
name = "obd-core"
version = "0.1.0"
edition = "2021"
description = "Ядро OBD2/ELM327: транспорты, AT-стек, PID'ы, DTC, VIN"
license = "MIT"

[dependencies]
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "time", "io-util", "rt", "macros"] }
serialport = { version = "4", optional = true }

[features]
default = []
serial = ["dep:serialport"]

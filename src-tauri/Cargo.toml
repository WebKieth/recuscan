[package]
name = "recuscan"
version = "0.1.0"
edition = "2021"
description = "RecuScan — открытый сканнер ЭБУ (ELM327/OBD2)"

[lib]
name = "recuscan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
obd-core = { path = "../crates/obd-core" }
tauri-plugin-btspp = { path = "../plugins/tauri-plugin-btspp" }

[target.'cfg(target_os = "android")'.dependencies]
base64 = "0.22"
async-trait = "0.1"

[features]
# USB/Serial транспорт: cargo build --features serial
serial = ["obd-core/serial"]

# Минимальный размер release-сборки (важно для Android-APK)
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
